<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p2p-video-chat</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <!-- TEMP debug: remove once TV issue is resolved -->
  <script>
    (function () {
      var box = document.createElement("pre");
      box.style.cssText =
        "position:fixed;left:0;right:0;bottom:0;max-height:45%;z-index:9999;" +
        "margin:0;padding:0.5rem;background:#000;color:#0f0;font-size:16px;" +
        "white-space:pre-wrap;overflow:auto;border-top:2px solid #0f0";
      function ready() { document.body.appendChild(box); }
      if (document.body) ready(); else window.addEventListener("DOMContentLoaded", ready);

      function log(prefix, msg) {
        var line = document.createElement("div");
        line.textContent = prefix + ": " + msg;
        box.appendChild(line);
      }

      window.addEventListener("error", function (e) {
        log("ERROR", (e.message || e.error) + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        log("REJECT", (r && (r.stack || r.message || r.name)) || String(r));
      });

      var origErr = console.error.bind(console);
      console.error = function () {
        var parts = [];
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          parts.push(a instanceof Error ? (a.name + ": " + a.message) : (typeof a === "object" ? JSON.stringify(a) : String(a)));
        }
        log("console.error", parts.join(" "));
        origErr.apply(console, arguments);
      };
    })();
  </script>
  <body>
    <main class="green-room" id="greenRoom">
      <h1>Join a room</h1>

      <div class="preview-wrap">
        <video id="preview" autoplay playsinline muted></video>
        <p id="previewStatus" class="preview-status">Requesting camera and microphone…</p>
      </div>

      <div class="controls">
        <button id="toggleMic" class="toggle" type="button" aria-pressed="true">Mic on</button>
        <button id="toggleCam" class="toggle" type="button" aria-pressed="true">Camera on</button>
      </div>

      <form id="joinForm" class="join-form" autocomplete="off">
        <label>
          Your name
          <input id="nameInput" type="text" maxlength="40" required placeholder="e.g. Alex" />
        </label>

        <label>
          Room name
          <input id="roomInput" type="text" maxlength="60" required placeholder="e.g. team-standup" />
        </label>

        <label>
          Room password
          <input id="passwordInput" type="password" maxlength="128" required />
        </label>

        <label>
          Camera
          <select id="cameraSelect"></select>
        </label>

        <label>
          Microphone
          <select id="micSelect"></select>
        </label>

        <button id="joinBtn" class="join-btn" type="submit" disabled>Join</button>
      </form>
    </main>

    <section class="room hidden" id="room">
      <header class="room-bar">
        <span id="roomTitle" class="room-title"></span>
        <div class="room-controls">
          <button id="roomMic" class="toggle" type="button" aria-pressed="true">Mic on</button>
          <button id="roomCam" class="toggle" type="button" aria-pressed="true">Camera on</button>
          <button id="leaveBtn" class="leave-btn" type="button">Leave</button>
        </div>
      </header>
      <div id="grid" class="grid"></div>
    </section>

    <script type="module" src="/js/greenroom.js"></script>
  </body>
</html>
